[package]
name = "api-server"
version = "0.1.0"
edition = "2021"

[dependencies]
management-system-core = { workspace = true }
management-system-finance = { workspace = true }
management-system-assets = { workspace = true }
management-system-ops = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
