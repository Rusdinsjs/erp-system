# version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mgmt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-management_system}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5436}:5432"
    # healthcheck:
    #   test: [ "CMD-SHELL", "pg_isready" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mgmt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6382}:6379"
    # healthcheck:
    #   test: [ "CMD", "redis-cli", "ping" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mgmt-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-management_system}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-management-system-secret-key-change-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      ENVIRONMENT: production
      RUST_LOG: info
    expose:
      - "8080"
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Frontend Web Admin
  frontend:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: mgmt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80" # Map host 8080 to container 80 (Nginx)

  # Database migrations (run once)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: mgmt-migrate
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-management_system}
    profiles:
      - migrate

  # AI Service (Ollama)
  ms-ai-ollama:
    image: ollama/ollama:latest
    container_name: ms-ai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: mgmt-network
