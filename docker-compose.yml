name: management-system

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mgmt-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-management_system}
      # Beritahu postgres untuk pakai hba_file kita saat init
      POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount custom pg_hba.conf — trust auth untuk semua koneksi Docker internal
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # Override pg_hba.conf location sehingga trust auth aktif
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "${DB_PORT:-5436}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-management_system}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mgmt-redis
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6382}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mgmt-backend
    restart: unless-stopped
    mem_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Trust auth aktif → password di URL ini TIDAK perlu cocok dengan volume
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-management_system}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-management-system-secret-key-change-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      ENVIRONMENT: production
      RUST_LOG: info
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Web Admin
  frontend:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: mgmt-frontend
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - backend
    ports:
      - "8888:80" # Map host 8888 to container 80 (Nginx)

  # Database migrations (run once)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: mgmt-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-management_system}
    profiles:
      - migrate

  # AI Service (Ollama)
  ms-ai-ollama:
    image: ollama/ollama:latest
    container_name: ms-ai-ollama
    restart: unless-stopped
    mem_limit: 4096m
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - default
    profiles:
      - ai

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: mgmt-network
