# ================================================================
# PostgreSQL Client Authentication Configuration (pg_hba.conf)
# ================================================================
# Strategi: TRUST untuk semua koneksi internal Docker.
# Password sama sekali tidak diperlukan dari container ke container.
# Ini mengeliminasi masalah "password out-of-sync" SELAMANYA.
# ================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# --- Unix socket (untuk admin tasks: pg_isready, psql admin) ---
local   all             all                                     trust

# --- Docker internal networks (backend, migrate, dll) ---
# Docker bridge default: 172.17.0.0/16
# Docker compose network: 172.16.0.0/12 (covers 172.16-172.31)
# Beberapa setup Docker pakai 10.x
host    all             all             172.16.0.0/12           trust
host    all             all             10.0.0.0/8              trust
host    all             all             192.168.0.0/16          trust

# --- Localhost (untuk pg_isready dari host, tools lokal) ---
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# --- Semua koneksi lain: pakai password (keamanan eksternal) ---
host    all             all             all                     scram-sha-256
