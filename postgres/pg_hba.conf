# ================================================================
# PostgreSQL Client Authentication Configuration (pg_hba.conf) - QSEC-011
# ================================================================
# All network connections require SCRAM-SHA-256 authentication.
# Trust authentication is removed to prevent unauthenticated access.
# ================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local Unix domain socket (system admin / pg_isready)
local   all             all                                     scram-sha-256

# Localhost IPv4 & IPv6 connections
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Internal Docker networks (Bridge networks)
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# All remote network hosts MUST authenticate via SCRAM-SHA-256
host    all             all             all                     scram-sha-256
