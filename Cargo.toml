[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/finance",
    "crates/assets",
    "crates/ops",
    "crates/api-server",
]

[workspace.dependencies]
# Web Framework & Async
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "limit"] }

# Database (SQLx)
sqlx = { version = "0.7", features = [
    "runtime-tokio", 
    "postgres", 
    "chrono", 
    "json",
    "rust_decimal",
    "uuid",
    "migrate"
] }

# Data Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Financial
rust_decimal = { version = "1.35", features = ["serde-float"] }
rust_decimal_macros = "1.35"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Authentication
jsonwebtoken = "9.0"
argon2 = "0.5"

# Environment
dotenvy = "0.15"

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
deadpool-redis = "0.22.0"
redis = { version = "0.32", features = ["tokio-comp", "json"] }
csv = "1.4.0"
tokio-cron-scheduler = "0.15.1"
image = { version = "0.24", features = ["webp"] }

# Validation
regex = "1.10"

# OpenAPI
utoipa = { version = "4.2", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Real-time / WebSockets
futures = "0.3"
genpdf = { version = "0.2.0", features = ["images"] }
lettre = { version = "0.11.19", features = ["smtp-transport", "tokio1", "builder", "tokio1-native-tls"] }
mime_guess = "2.0"

# Testing
http-body-util = "0.1.3"
tokio-test = "0.4"
tower = { version = "0.5.2", features = ["util"] }

# Local Workspace Crates
management-system-core = { path = "crates/core" }
management-system-finance = { path = "crates/finance" }
management-system-assets = { path = "crates/assets" }
management-system-ops = { path = "crates/ops" }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.password-hash]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"



