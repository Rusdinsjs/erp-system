name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            cd ~/management-system
            
            # Ambil pembaruan terbaru dari GitHub
            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main
            git pull
            
            # Restart Nginx di VPS
            sudo systemctl reload nginx || true
            
            # Build dan jalankan SEMUA layanan (termasuk AI Ollama yang baru ditambahkan)
            sudo docker compose up -d --build --remove-orphans
            
            # Tunggu database siap, lalu sync password agar cocok dengan config
            sleep 10
            sudo docker exec mgmt-db psql -U postgres -c "ALTER USER postgres PASSWORD 'postgres';" || true
            
            # Restart backend agar koneksi database berhasil
            sudo docker compose restart backend || true
            
            # Bersihkan image yang tidak terpakai
            sudo docker image prune -f
