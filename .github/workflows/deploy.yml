name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-admin
          file: ./web-admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd ~/erp-system

            # ── 1. Ambil kode terbaru ──────────────────────────────────────────
            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main
            echo ">> Kode terbaru sudah diambil."

            # ── 2. Validasi .env ───────────────────────────────────────────────
            if [ ! -f .env ]; then
              echo "ERROR: File .env tidak ditemukan di VPS!"
              echo "Buat dulu: cp .env.example .env && nano .env"
              exit 1
            fi
            echo ">> File .env ditemukan."

            # ── 3. Stop container app ──────────────────────────────────────────
            echo ">> Stop container app..."
            sudo docker compose stop backend frontend ms-ai-ollama redis 2>/dev/null || true
            sudo docker compose rm -f backend frontend ms-ai-ollama redis 2>/dev/null || true

            # ── 4. Pastikan postgres berjalan & pakai config terbaru ───────────
            echo ">> Memastikan postgres berjalan..."
            sudo docker compose up -d --force-recreate postgres
            echo ">> Menunggu postgres siap..."
            for i in $(seq 1 24); do
              if sudo docker exec mgmt-db pg_isready -q 2>/dev/null; then
                echo ">> Postgres SIAP! ($i/24)"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "ERROR: Postgres tidak siap setelah 120 detik!"
                sudo docker logs mgmt-db --tail 30
                exit 1
              fi
              echo "   Menunggu postgres... ($i/24)"
              sleep 5
            done

            # ── 5. Pastikan database ada ───────────────────────────────────────
            DB_NAME=$(grep -E "^DB_NAME=" .env | cut -d '=' -f2 | tr -d '\r\n ')
            DB_USER=$(grep -E "^DB_USER=" .env | cut -d '=' -f2 | tr -d '\r\n ')
            DB_NAME=${DB_NAME:-management_system}
            DB_USER=${DB_USER:-postgres}

            echo ">> Memastikan database '${DB_NAME}' ada..."
            sudo docker exec mgmt-db psql -U postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}';" \
              | grep -q 1 \
              || sudo docker exec mgmt-db psql -U postgres -c \
              "CREATE DATABASE ${DB_NAME} OWNER ${DB_USER};"
            echo ">> Database OK!"

            # ── 6. Pull image pre-built dari GHCR (Super Cepat!) ──────────────
            echo ">> Pull image terbaru dari GHCR..."
            sudo docker compose pull backend frontend || sudo docker compose build backend frontend

            # ── 7. Start semua layanan ─────────────────────────────────────────
            echo ">> Start semua layanan..."
            sudo docker compose up -d --remove-orphans

            # ── 8. Tunggu backend benar-benar siap ────────────────────────────
            echo ">> Menunggu backend siap..."
            BACKEND_OK=0
            for i in $(seq 1 30); do
              if sudo docker exec mgmt-backend curl -sf http://localhost:8080/health \
                  >/dev/null 2>&1; then
                echo ">> Backend SIAP! ($i/30)"
                BACKEND_OK=1
                break
              fi
              echo "   Menunggu backend... ($i/30)"
              sleep 5
            done

            if [ "$BACKEND_OK" -eq 0 ]; then
              echo ""
              echo "WARNING: Backend tidak merespons setelah 150 detik."
              echo ">> Log backend (50 baris terakhir):"
              sudo docker logs mgmt-backend --tail 50
              echo ""
              echo ">> Status semua container:"
              sudo docker compose ps
            fi

            # ── 9. Reload Nginx ────────────────────────────────────────────────
            sudo systemctl reload nginx || true

            # ── 10. Bersihkan image lama ───────────────────────────────────────
            sudo docker image prune -f

            echo ""
            echo "════════════════════════════════════════════════"
            echo "  ✅ DEPLOY SELESAI VIA GHCR! (Super Cepat)"
            echo "════════════════════════════════════════════════"
            sudo docker compose ps
