name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/management-system
            
            # Ambil pembaruan terbaru dari GitHub
            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main
            git pull
            
            # Restart Nginx di VPS untuk memastikan tidak ada cache
            # (opsional, tapi berguna jika ada perubahan di nginx.conf)
            sudo systemctl reload nginx || true
            
            # Build ulang dan jalankan kontainer Docker (Backend & Frontend)
            sudo docker compose up -d --build
            
            # Bersihkan image yang tidak terpakai untuk hemat ruang harddisk
            sudo docker image prune -f
